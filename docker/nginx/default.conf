# TLS снимает OrbStack на gshome.local и отдаёт сюда http.
# PHP должен считать запрос защищённым, иначе Filament генерирует http://-ссылки.
server {
    listen 80 default_server;
    server_name gshome.local;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 32m;

    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Адрес app резолвится на каждый запрос: после пересоздания контейнера
    # у него новый IP, и запомненный при старте давал бы 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass $php_upstream;
    }
}
