; В официальном образе нет php.ini, а встроенный short_open_tag = On.
short_open_tag = Off

; CLI (artisan, Horizon, тесты, composer) — без лимита; сайту лимит задаёт zz-pool.conf.
memory_limit = -1
upload_max_filesize = 16M
post_max_size = 32M
max_execution_time = 30
date.timezone = Asia/Tbilisi

; Xdebug установлен, но выключен: XDEBUG_MODE=debug docker compose up -d
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
